<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AERIS | Access Movement Intelligence Portal</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- AERIS Custom Design Tokens CSS -->
  <link rel="stylesheet" href="/aeris.css">

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-highest": "#dee4df",
            "surface-bright": "#fafbfa",
            "background": "#fafbfa",
            "surface": "#fafbfa",
            "primary": "#16a34a",
            "primary-container": "#b7f34a",
            "on-primary-container": "#111714",
            "error": "#ba1a1a",
            "outline-variant": "#c3c9b0"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans", "sans-serif"],
            "body": ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-zinc-900 antialiased font-body min-h-screen flex flex-col justify-between">

  <!-- Header Navigation -->
  <header class="w-full py-6 px-8 flex justify-between items-center max-w-7xl mx-auto">
    <div>
      <a href="/index.html" class="flex items-center gap-3">
        <img src="/logo.png" alt="AERIS Logo" class="h-14 md:h-16 w-auto object-contain max-h-16 transition-transform hover:scale-105">
      </a>
    </div>
    <a href="/index.html" class="text-xs font-bold text-slate-600 hover:text-emerald-700 flex items-center gap-1">
      <span class="material-symbols-outlined text-base">arrow_back</span> Back to Overview
    </a>
  </header>

  <!-- Main Auth Card Container -->
  <main class="my-auto py-10 px-4 w-full max-w-md mx-auto">
    
    <!-- Brand Logo Header -->
    <div class="text-center mb-8">
      <img src="/logo.png" alt="AERIS Logo" class="h-16 md:h-20 w-auto object-contain mx-auto mb-2 transition-transform hover:scale-105">
      <p class="text-slate-500 text-xs mt-1">Biomechanical Movement Intelligence Platform</p>
    </div>

    <!-- Auth Card -->
    <div class="aeris-card overflow-hidden shadow-2xl">
      
      <!-- Tab Switcher -->
      <div class="flex border-b border-slate-200">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-emerald-700 border-b-2 border-emerald-600 bg-emerald-50/50">
          Sign In
        </button>
        <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-900 border-b-2 border-transparent">
          Create Account
        </button>
      </div>

      <!-- Login Form -->
      <form id="form-login" onsubmit="handleLoginSubmit(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
          <input type="email" id="login-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-emerald-500" placeholder="athlete@aeris.ai">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Password</label>
            <a href="#" class="text-xs text-emerald-600 font-semibold hover:underline">Forgot?</a>
          </div>
          <input type="password" id="login-password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-emerald-500" placeholder="••••••••">
        </div>

        <button type="submit" id="btn-login-submit" class="w-full btn-primary py-3 justify-center text-sm font-bold rounded-full mt-2">
          Access Dashboard
          <span class="material-symbols-outlined text-base">arrow_forward</span>
        </button>
      </form>

      <!-- Signup Form -->
      <form id="form-signup" onsubmit="handleSignupSubmit(event)" class="p-6 space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Full Name</label>
          <input type="text" id="signup-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-emerald-500" placeholder="Alex Morgan">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
          <input type="email" id="signup-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-emerald-500" placeholder="alex@aeris.ai">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Role / Account Type</label>
          <select id="signup-role" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-emerald-500">
            <option value="athlete">Athlete</option>
            <option value="coach">Strength & Conditioning Coach</option>
            <option value="therapist">Physical Therapist / Clinician</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Create Password</label>
          <input type="password" id="signup-password" required minlength="6" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-900 font-medium focus:outline-none focus:border-emerald-500" placeholder="••••••••">
        </div>

        <button type="submit" id="btn-signup-submit" class="w-full btn-primary py-3 justify-center text-sm font-bold rounded-full mt-2">
          Create Account & Initialize
          <span class="material-symbols-outlined text-base">person_add</span>
        </button>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-6 text-center text-xs text-slate-400 border-t border-slate-200">
    © 2026 AERIS Performance Lab. All rights reserved.
  </footer>

  <script src="/app.js"></script>
  <script>
    function switchAuthTab(tab) {
      const loginForm = document.getElementById("form-login");
      const signupForm = document.getElementById("form-signup");
      const loginTab = document.getElementById("tab-login");
      const signupTab = document.getElementById("tab-signup");

      if (tab === "login") {
        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");
        loginTab.className = "flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-emerald-700 border-b-2 border-emerald-600 bg-emerald-50/50";
        signupTab.className = "flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-900 border-b-2 border-transparent";
      } else {
        signupForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
        signupTab.className = "flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-emerald-700 border-b-2 border-emerald-600 bg-emerald-50/50";
        loginTab.className = "flex-1 py-3.5 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-900 border-b-2 border-transparent";
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      try {
        const data = await apiRequest("/api/auth/login", "POST", { email, password });
        setAuthToken(data.access_token, data.user);
        showToast("Login successful! Redirecting to Dashboard...", "success");
        setTimeout(() => window.location.href = "/dashboard.html", 800);
      } catch (err) {
        showToast("Login failed: " + err.message, "error");
      }
    }

    async function handleSignupSubmit(e) {
      e.preventDefault();
      const full_name = document.getElementById("signup-name").value;
      const email = document.getElementById("signup-email").value;
      const role = document.getElementById("signup-role").value;
      const password = document.getElementById("signup-password").value;

      try {
        const data = await apiRequest("/api/auth/signup", "POST", { full_name, email, password, role });
        setAuthToken(data.access_token, data.user);
        showToast("Account created successfully! Redirecting...", "success");
        setTimeout(() => window.location.href = "/dashboard.html", 800);
      } catch (err) {
        showToast("Signup failed: " + err.message, "error");
      }
    }
  </script>
</body>
</html>
